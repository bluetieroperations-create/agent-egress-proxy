# Automated, GUARDED refresh of the prebuilt free-tier seed store (Stage 2 of
# docs/DATA_COMPLETENESS.md -- "lock in durability": kill the ~90-day stale cliff
# without a human running `make refresh-seed` by hand).
#
# What it does: rebuild the corpus from live on-chain history into a TEMP candidate,
# run refresh_guard.py against the committed store, and ONLY if the guard ACCEPTs the
# candidate, open (or update) a PULL REQUEST with the refreshed artifacts. It never
# pushes to the working branch directly and never overwrites the committed store in
# place -- so a partial crawl or a no-op can never ship, and every refresh still passes
# the full test suite (incl. test_coverage_eval's seed-regression gate) on the PR
# before a human merges. On REJECT it opens/updates a nag issue and changes nothing.
#
# WHAT THE RUN STATUS MEANS. This is the whole point of the job's exit codes, so read
# it before "fixing" one: GREEN means there is nothing for a human to do -- either a PR
# is open/updated with a refreshed corpus, or the refresh produced no change to data/ at
# all. RED means a human is needed, and an ISSUE has been filed saying which of the two
# reasons it is.
#
# Note which side a guard REJECT falls on: it is RED. A reject means the corpus did not
# get fresher this week and is still walking toward the stale cliff, which is a human's
# problem even though nothing shipped and nothing broke. An earlier draft of this very
# comment said green covered "the guard found nothing worth proposing", which reads as
# though a reject were green -- the exact ambiguity this file exists to remove, in the
# file that removes it.
#
# It did not always work that way. Until 2026-09-21 the reject path filed its nag and
# then exited 0, while the accept path died on `gh pr create`, so the status was exactly
# INVERTED: the one green run in five (2026-08-31) was the one where the guard REJECTED
# the candidate and threw the refresh away, and every red run was a perfectly good
# corpus that had been crawled, guarded, tested and pushed. Five weeks of that is five
# weeks of a signal that meant the opposite of what it looked like.
#
# The companion seed-freshness.yml stays as the pure nag; this one acts.

name: seed-refresh

on:
  schedule:
    - cron: "23 8 * * 1"    # weekly, Mondays 08:23 UTC (ahead of the nag at 09:17)
  workflow_dispatch:
    inputs:
      max_pages:
        description: "chain_backfill --max-pages per payee (blank = script default, 4)"
        default: ""

permissions:
  contents: write        # to push the refresh branch
  pull-requests: write   # to open the PR
  issues: write          # to open the reject nag

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guarded refresh (temp candidate -> promote only on ACCEPT)
        id: refresh
        env:
          # NO hardcoded fallback. `:-` in refresh_seed.sh treats an empty value as
          # unset, so leaving this blank lets the SCRIPT's default govern -- one source
          # of truth. A literal '2' here silently overrode the script's default and made
          # the depth setting inert on every scheduled run.
          BACKFILL_PAGES: ${{ github.event.inputs.max_pages }}
        run: |
          set +e
          sh scripts/refresh_seed.sh
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Sanity-check the refreshed corpus
        if: steps.refresh.outputs.code == '0'
        run: |
          # the artifacts were promoted in-tree by the script; prove the suite still
          # passes on the NEW corpus before proposing it (seed-regression gate included).
          python3 -m unittest test_coverage_eval.py test_refresh_guard.py \
            test_verdict_oracle.py test_calibration_lock.py

      - name: Open / update the refresh PR
        id: propose
        if: steps.refresh.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if git diff --quiet -- data/; then
            echo "No data changes after guard -- nothing to propose."
            exit 0
          fi
          BRANCH="auto/seed-refresh"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"

          # `git add -A data/`, NOT a fixed list of the three store artifacts. The
          # refresh also writes data/reputation_seed.json (the provenance record) and
          # DELETES it when seed_provenance.py fails -- refresh_seed.sh removes a stale
          # record on purpose, because a provenance file describing the PREVIOUS store
          # sitting beside the new one is confidently wrong rather than merely absent.
          # A fixed `git add` dropped both the addition and the deletion on the floor,
          # which is the one outcome that script goes out of its way to prevent.
          git add -A data/

          FRESH="$(python3 check_seed_age.py || true)"
          git commit -m "data: automated guarded seed refresh" \
                     -m "$FRESH" \
                     -m "Refreshed by .github/workflows/seed-refresh.yml; refresh_guard.py ACCEPTed the candidate."
          git push -f origin "$BRANCH"
          {
            echo "branch=$BRANCH"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "PR already open for $BRANCH; force-pushed the update."
            exit 0
          fi

          # Body via --body-file. Inline `--body "$FRESH ..."` inside a YAML block
          # scalar carried the block's own indentation into the rendered PR body.
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          {
            printf '%s\n\n' "$FRESH"
            printf 'Guarded refresh from `scripts/refresh_seed.sh` (refresh_guard.py ACCEPTed the candidate: size retained + genuinely fresher). Merging redeploys a fresh free-tier corpus. Automated by `.github/workflows/seed-refresh.yml`.\n'
          } > "$BODY_FILE"

          set +e
          OUT="$(gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
                   --title "Automated seed refresh" --body-file "$BODY_FILE" 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" = "0" ]; then
            exit 0
          fi

          # The refusal we actually hit every week. It is a REPOSITORY SETTING, not a
          # token scope: no credential available to this workflow can route around it,
          # so failing here with a raw GraphQL error taught nobody anything. Hand it to
          # the nag step below, which says what to flip and then fails the job loudly.
          if printf '%s' "$OUT" | grep -q "not permitted to create or approve pull requests"; then
            echo "pr_blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$RC"

      - name: Nag -- refresh is good, but Actions may not open the PR
        if: steps.propose.outputs.pr_blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TITLE="Automated seed refresh cannot open its PR"
          BRANCH="${{ steps.propose.outputs.branch }}"
          REPO="${{ github.repository }}"
          BODY_FILE="$RUNNER_TEMP/nag.md"
          {
            echo "The guarded refresh **succeeded** and \`refresh_guard.py\` **ACCEPTed** the candidate."
            echo "The refreshed corpus passed the suite and is pushed, waiting on"
            echo "[\`$BRANCH\`](https://github.com/$REPO/tree/$BRANCH) at \`${{ steps.propose.outputs.sha }}\`."
            echo ""
            echo '```'
            python3 check_seed_age.py || true
            echo '```'
            echo ""
            echo "Only the pull-request step failed. **Settings -> Actions -> General -> Workflow permissions -> \"Allow GitHub Actions to create and approve pull requests\"** is off for this repository. That is a repository setting a maintainer has to flip; no token available to this workflow can work around it."
            echo ""
            echo "Until it is flipped, open the PR by hand:"
            echo ""
            echo "<https://github.com/$REPO/compare/${{ github.ref_name }}...$BRANCH?expand=1>"
            echo ""
            echo "_Automated from .github/workflows/seed-refresh.yml._"
          } > "$BODY_FILE"
          EXISTING="$(gh issue list --state open --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
          echo "::error::Refresh succeeded but the PR could not be opened -- see the issue above. The corpus is waiting on $BRANCH."
          exit 1

      - name: Nag -- the guard rejected the candidate
        if: steps.refresh.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TITLE="Automated seed refresh was rejected"
          BODY_FILE="$RUNNER_TEMP/nag.md"
          {
            echo "The guarded refresh (\`scripts/refresh_seed.sh\`) ran but \`refresh_guard.py\` **REJECTED** the candidate (partial crawl / no progress / stale result -- the guard prints its reasons in the [job log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo ""
            echo "The committed store was left untouched, so **nothing shipped and nothing broke** -- but the corpus did not get any fresher this week:"
            echo ""
            echo '```'
            python3 check_seed_age.py || true
            echo '```'
            echo ""
            echo "Re-run the workflow, or refresh manually, once the on-chain data source is healthy."
            echo ""
            echo "_Automated from .github/workflows/seed-refresh.yml._"
          } > "$BODY_FILE"
          EXISTING="$(gh issue list --state open --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
          echo "::error::The refresh guard REJECTED the candidate -- the committed corpus is unchanged. See the issue above."
          exit 1
