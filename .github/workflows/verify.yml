name: verify

# Continuously verify BlackWall's security claims. Two independent lines of
# evidence run on every push / PR:
#   1. the TDD unit suite over the security-boundary pure functions, and
#   2. the live-traffic audit that drives the real proxy and confirms each
#      property asserted in TRUST.md / THREAT_MODEL.md holds end-to-end.
# The audit exits non-zero if any claim regresses, failing the build.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests (security-boundary functions)
        run: python -m unittest test_egress_proxy.py -v

      - name: Live-traffic security audit (claims verification)
        run: python audit_claims.py
