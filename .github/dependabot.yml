# Dependabot, configured EXPLICITLY because the default was not enough.
#
# WHY THIS FILE EXISTS. There was no config here, so Dependabot ran on auto-discovery.
# On 2026-09-15 it found the @vitest/mocker advisory and opened exactly ONE pull request,
# scoped to /integrations/openclaw (merged as #53). integrations/lucid depends on the
# same package and was never raised. Three weeks later it still carried the whole chain:
#
#     tinypool        critical   prototype pollution -> RCE
#     vitest          critical   path traversal via @vitest/mocker
#     source-map-js   high       event-loop DoS
#     @vitest/mocker  moderate   arbitrary file read
#
# An advisory fixed in one directory and missed in its sibling is the failure mode this
# file prevents: every npm manifest in the repo is now listed by name, so a future
# advisory raises a PR per directory instead of per directory Dependabot happened to see.
#
# WHY EACH DIRECTORY IS LISTED SEPARATELY rather than relying on discovery: a listed
# directory that disappears is a config error someone notices, while an unlisted one that
# appears is silence. The repo has exactly two npm manifests today
# (`find . -name package.json -not -path "*/node_modules/*"`); adding a third means
# adding it here, and test_dependabot_config.py fails until it is.
#
# The Python side is deliberately ABSENT. The proxy itself is stdlib-only with no
# requirements.txt to watch -- the pypi entries in the dependency graph come from optional
# integration extras that pin no versions, so there is nothing for Dependabot to bump.
version: 2
updates:
  # SECURITY updates are on by default and need no entry here; these blocks add the
  # VERSION updates, which is what keeps a lockfile from pinning a transitive dependency
  # behind its own fix. openclaw sat on vitest 5.0.0 while 5.0.3 was out, and `^5.0.0`
  # allowed it: npm install does not upgrade an already-satisfied dependency, so the
  # chain under it (vite -> postcss -> source-map-js 1.2.1) stayed vulnerable with the
  # patched 1.2.2 one `npm update` away.
  - package-ecosystem: "npm"
    directory: "/integrations/openclaw"
    schedule:
      interval: "weekly"
      day: "tuesday"          # away from the Monday seed-refresh and Thursday directory crons
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the test-runner chain instead of four. vitest, its mocker, its pool and
      # its vite/postcss transitives move together, and splitting them produces PRs that
      # cannot pass CI alone.
      vitest:
        patterns: ["vitest", "@vitest/*", "tinypool", "vite", "postcss", "source-map-js"]

  - package-ecosystem: "npm"
    directory: "/integrations/lucid"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*", "tinypool", "vite", "postcss", "source-map-js"]

  # The workflows pin actions by major tag (actions/checkout@v4 etc). Without this, a
  # deprecation lands as a runner warning nobody acts on -- the Node 20 notice has been
  # printing on every run in this repo for weeks.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
