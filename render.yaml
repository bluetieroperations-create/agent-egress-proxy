# Render blueprint for the Blackwall verdict service.
# Render detects this file at the repo root: New > Blueprint, point it here.
#
# State (SQLite store + JSONL ledger) persists on the attached disk at /data.
# Secrets are declared with `sync: false` -- Render prompts for them at deploy
# time and stores them encrypted; they are never committed here or baked in.
services:
  - type: web
    name: blackwall
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # smallest paid plan; disks require a paid plan
    region: oregon
    autoDeploy: false        # deploy on demand, not on every push
    healthCheckPath: /healthz

    # Persistent volume -- Render routes external HTTPS to the port the process
    # listens on (8402, set via BLACKWALL_PORT below + EXPOSE in the Dockerfile).
    disk:
      name: blackwall-data
      mountPath: /data
      sizeGB: 1

    envVars:
      # Non-secret config (mirrors the Dockerfile ENV).
      - key: BLACKWALL_HOST
        value: "0.0.0.0"
      - key: BLACKWALL_PORT
        value: "8402"
      - key: BLACKWALL_STORE
        value: /data/reputation.db
      - key: BLACKWALL_LEDGER
        value: /data/ledger.jsonl
      # 0: unknown counterparty -> instant cold-start HOLD. Lazy ingest (1) does a
      # SYNCHRONOUS on-chain fetch on the hot path -> blocks past the request timeout
      # on a cold store -> 502. Pre-warm from the manifest (data/seed_payees.txt).
      - key: BLACKWALL_INGEST
        value: "0"
      # Pricing posture (see PRICING.md): value-aligned / freemium-on-stakes.
      # Low-stakes verdicts free (incl. sanctions safety); high-stakes pay.
      # Per-client rate limit for the PUBLIC endpoint (POST paths only; GET health/
      # discovery stay unthrottled). Default is 0 = DISABLED, so an unset value ships
      # an unthrottled public endpoint -- which matters most with billing OFF, where
      # every call is free to the caller. 120 req/min per client IP, burst 30: generous
      # for a legit agent, caps hammering/scraping/DoS.
      - key: BLACKWALL_RATE_LIMIT
        value: "120"
      - key: BLACKWALL_RATE_WINDOW
        value: "60"
      - key: BLACKWALL_RATE_BURST
        value: "30"
      - key: BLACKWALL_VALUE_PRICING
        value: "1"
      - key: BLACKWALL_FREE_BELOW
        value: "10.00"
      # Secrets -- Render prompts for these; left unset, billing stays OFF and
      # the service runs free/public (the server prints a loud warning).
      - key: BLACKWALL_PAY_TO
        sync: false
      - key: BLACKWALL_FACILITATOR
        sync: false
      - key: BLACKWALL_RECEIPT_KEY
        sync: false
      # CDP (Coinbase Developer Platform) facilitator credentials. When BOTH are
      # set, the service settles through the authenticated CDP facilitator --
      # required for Coinbase Bazaar to catalog the endpoint on its first settled
      # payment. Leave BLACKWALL_FACILITATOR unset and these two set to use the
      # canonical CDP mainnet URL; set BLACKWALL_FACILITATOR only to override it.
      # Without these, settlement falls back to the keyless community facilitator
      # in BLACKWALL_FACILITATOR (settles on-chain but does NOT list on Bazaar).
      # CDP_API_KEY_SECRET is the base64 Ed25519 secret from the CDP portal.
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      # OFAC screening ON by default: points at the snapshot baked into the image
      # (Dockerfile COPY sanctions.txt). Refresh with `python sanctions.py
      # sanctions.txt` + redeploy, or override to a self-maintained list on /data.
      # Each payee's OWN advertised price bounds, from the x402 discovery crawl and
      # baked into the image (Dockerfile). Lets a price STOP be WITHHELD on a premium
      # route the payee publicly lists -- but only alongside real settlement evidence,
      # since the range is payee-authored (see advertised_prices.py). Set explicitly
      # rather than relying on the relative default resolving against WORKDIR.
      - key: BLACKWALL_ADVERTISED_INDEX
        value: /app/data/directory.json
      - key: BLACKWALL_SANCTIONS
        value: /app/sanctions.txt
      # Best-effort refresh the OFAC list from the published source on each start
      # (fail-open: falls back to the baked-in snapshot). Keeps screening current
      # without re-baking the image, since Render restarts pick up the latest.
      - key: BLACKWALL_SANCTIONS_REFRESH
        value: "1"
