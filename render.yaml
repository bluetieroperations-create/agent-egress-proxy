# Render Blueprint for the Traceipt API (Base Sepolia REAL mode).
# Render reads render.yaml from the REPO ROOT. The service builds the Docker
# image in traceipt/ and Render terminates HTTPS at its edge, so the app
# binds 0.0.0.0.
#
# This is the testnet-REAL config (see traceipt/FLYWHEEL.md): real x402 v2
# facilitator gate + on-chain (rpc) settlement verification on Base Sepolia --
# real crypto, no real money. The two SECRETS below (sync:false) are set in
# the Render dashboard's Environment tab, not here.
#
# New > Blueprint > connect this repo > pick the branch that has this file.
services:
  - type: web
    name: traceipt                 # -> https://traceipt.onrender.com (or a suffix if taken)
    runtime: docker
    rootDir: traceipt              # build context = the traceipt/ project dir
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RECEIPTS_HOST
        value: "0.0.0.0"
      - key: RECEIPTS_PORT
        value: "8402"
      - key: RECEIPTS_CHAIN
        value: base-sepolia
      # REAL mode: charge via a facilitator and verify settlement on-chain.
      - key: X402_GATE
        value: facilitator
      - key: RECEIPTS_FACILITATOR_URL
        value: https://facilitator.x402.rs   # supports base-sepolia, keyless
      - key: RECEIPTS_SETTLEMENT
        value: rpc
      - key: RECEIPTS_RPC_URL
        value: https://sepolia.base.org
      - key: RECEIPTS_MIN_CONFIRMATIONS
        value: "0"                            # testnet; set a few for mainnet
      # Seller-hosted binding: this instance issues receipts ONLY for payments
      # to this wallet, and (bind_payer) only to the wallet that paid the fee.
      # PAY_TO is a public receiving address -- never a private key.
      - key: RECEIPTS_PAY_TO
        value: "0x3ec5e0ec1e1cb8e2afa36f3b40eed9057d9004e1"
      - key: RECEIPTS_SELLER_ID
        value: traceipt.xyz
      - key: RECEIPTS_BIND_PAYER
        value: "1"
      - key: RECEIPTS_PRICE_BASE_UNITS
        value: "2000"                         # $0.002 per /attest or /receipts
      # Hands-free Merkle sealing: auto-seal any pending batch every N seconds
      # so callers never need an admin POST /anchor. 0 = manual only. On the
      # free plan the loop pauses while the instance is idle and resumes on the
      # next request, so a pending item seals within N seconds of activity.
      - key: RECEIPTS_ANCHOR_INTERVAL
        value: "300"                          # 5 min
      # Public URL embedded in verify links + invoice QR. Set to the custom
      # domain you will attach (below). If you test via the *.onrender.com URL
      # before the domain is live, change this to that URL instead.
      - key: RECEIPTS_BASE_URL
        value: https://api.traceipt.xyz
      # SECRETS -- set in the Render dashboard (Environment tab), not here.
      # sync:false means the Blueprint will NOT manage/overwrite them.
      #   RECEIPTS_KEY_PEM   the durable Ed25519 signing key (root of trust for
      #                      every receipt; generate once, back it up). Prefer
      #                      the SINGLE-LINE base64 form below -- it has no
      #                      newlines to be mangled when pasted into a web form,
      #                      and the loader accepts it (also plain PEM / bare
      #                      base64 body). Back up whatever you paste:
      #     python3 -c "import base64;from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K;from cryptography.hazmat.primitives import serialization as s;print(base64.b64encode(K.generate().private_bytes(s.Encoding.DER,s.PrivateFormat.PKCS8,s.NoEncryption())).decode())"
      #   RECEIPTS_ADMIN_TOKEN  gates POST /anchor + /credits (random):
      #     python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: RECEIPTS_KEY_PEM
        sync: false
      - key: RECEIPTS_ADMIN_TOKEN
        sync: false
      #   RECEIPTS_GAS_KEY  private key of a DEDICATED gas wallet (never the
      #     receiving wallet) that signs on-chain Merkle-root txs. Fund it with
      #     a little Base Sepolia ETH. Only used when RECEIPTS_PUBLISHER=onchain
      #     (added below once this key is set -- turning it on without a funded
      #     gas key would crash the boot check).
      - key: RECEIPTS_GAS_KEY
        sync: false

# NOTE ON STORAGE: the free plan has NO persistent disk, so /data is
# ephemeral -- the ledger DB and the Ed25519 signing key reset whenever the
# instance restarts (Render also spins free services down after ~15 min idle,
# with a cold start on the next request). That means receipts issued in an
# earlier session stop verifying. This is fine for a demo. For a stable
# endpoint, switch to a paid instance and add a disk:
#
#     plan: starter          # ~$7/mo
#     disk:
#       name: traceipt-data
#       mountPath: /data
#       sizeGB: 1
